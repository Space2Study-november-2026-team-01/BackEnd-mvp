name: CI

on:
  push:
    branches: [main, develop, devops]
  pull_request:
    branches: [main, develop, devops]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017/sp_project_test
          SERVER_PORT: 3000
          SERVER_URL: http://127.0.0.1:3000
          CLIENT_URL: http://127.0.0.1:3001
          COOKIE_DOMAIN: localhost
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: ci-refresh-secret
          JWT_REFRESH_EXPIRES_IN: 7d
          JWT_RESET_SECRET: ci-reset-secret
          JWT_RESET_EXPIRES_IN: 1h
          JWT_CONFIRM_SECRET: ci-confirm-secret
          JWT_CONFIRM_EXPIRES_IN: 1d
          MAIL_USER: admin@example.com
          MAIL_PASS: ci-admin-pass
          MAIL_FIRSTNAME: CI
          MAIL_LASTNAME: Admin
          GMAIL_CLIENT_ID: ci-client-id
          GMAIL_CLIENT_SECRET: ci-client-secret
          GMAIL_REFRESH_TOKEN: ci-refresh-token
          GMAIL_REDIRECT_URI: http://127.0.0.1:3000/oauth2callback

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sp-project-be:ci .
